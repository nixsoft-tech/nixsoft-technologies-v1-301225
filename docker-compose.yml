# Secrets are read from a gitignored `.env` file in this directory
# (docker-compose loads it automatically). Copy `.env.example` to `.env`
# and fill in real values. `${VAR:?...}` guards make compose refuse to
# start if a required secret is missing — nothing falls back to a default.

services:
  # ─── Database for WordPress ──────────────────────────────────────────────────
  db:
    image: mariadb:10.11.8
    restart: always
    environment:
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wp_user
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?Set MYSQL_ROOT_PASSWORD in .env}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - nixsoft_network

  # ─── WordPress CMS ───────────────────────────────────────────────────────────
  wordpress:
    depends_on:
      - db
    image: wordpress:6.5.3-php8.3-apache
    restart: always
    # NO public ports — all traffic routed through nginx-proxy
    expose:
      - "80"
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
      # Raise PHP upload/time limits (default 2M is too small for imports)
      - ./wordpress/uploads.ini:/usr/local/etc/php/conf.d/uploads.ini:ro
    networks:
      - nixsoft_network

  # ─── Backend Server (Chat AI proxy, Logs & SMTP) ─────────────────────────────
  server:
    build:
      context: ./server
    restart: always
    # NO public ports — all traffic routed through nginx-proxy
    expose:
      - "5000"
    environment:
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      # The AI keys and SMTP_PASS may be empty — the server degrades
      # gracefully (chat runs in demo mode, /api/contact returns 503) and
      # logs a startup warning. This keeps `docker compose` usable (e.g.
      # for certbot bootstrap) before these values are filled in.
      # NixBot tries AI_PROVIDERS in order (Grok, then DeepSeek as fallback).
      - XAI_API_KEY=${XAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - AI_PROVIDERS=${AI_PROVIDERS:-grok,deepseek}
      - XAI_MODEL=${XAI_MODEL:-grok-4.7}
      - DEEPSEEK_MODEL=${DEEPSEEK_MODEL:-deepseek-flash}
      # NixBot abuse limits (see server/nixbot.js)
      - CHAT_RATE_PER_MINUTE=${CHAT_RATE_PER_MINUTE:-8}
      - CHAT_RATE_PER_HOUR=${CHAT_RATE_PER_HOUR:-60}
      - AI_DAILY_LIMIT=${AI_DAILY_LIMIT:-1500}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURE=${SMTP_SECURE:-false}
      - SMTP_USER=${SMTP_USER:-sales@nixsoftech.in}
      - SMTP_PASS=${SMTP_PASS:-}
      # Amazon SES instead of SMTP: set SES_REGION (credentials come from the
      # EC2 instance's IAM role) and SMTP_FROM, an address on the SES domain.
      - SES_REGION=${SES_REGION:-}
      - SMTP_FROM=${SMTP_FROM:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-sales@nixsoftech.in}
      # A value in .env overrides this — remove any UAT ALLOWED_ORIGINS there,
      # or the contact form and chat answer 403 on the production site.
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-https://nixsoftech.in}
    volumes:
      - chat_logs:/app/logs
    networks:
      - nixsoft_network

  # ─── React Frontend ───────────────────────────────────────────────────────────
  app:
    build:
      context: .
      args:
        # NOTE: no AI API key here — chat calls are proxied through the
        # backend so no API key ever ships in the browser bundle.
        - VITE_WORDPRESS_API_URL=https://blog.nixsoftech.in/wp-json/wp/v2
        # Empty string = use relative /api/... paths (proxied by nginx-proxy)
        - VITE_API_BASE_URL=
        #
        # VITE_SITE_URL is deliberately NOT set here. It feeds every
        # <link rel="canonical">, og:url, and the JSON-LD, and defaults to the
        # production apex (https://nixsoftech.in) — see constants.ts.
        #
        # Never set it to a UAT host: leaving it unset means a production
        # build is correct by default, whereas a UAT value here would ship
        # every page canonicalized to a dead staging host — the exact bug
        # fixed on 16 Jul 2026.
    restart: always
    # NO public ports — all traffic routed through nginx-proxy
    expose:
      - "80"
    networks:
      - nixsoft_network

  # ─── Nginx Reverse Proxy (Single public entry point) ─────────────────────────
  nginx-proxy:
    image: nginx:1.26.1-alpine
    restart: always
    # nginx reads certificates only at start/reload, so without this it keeps
    # serving the old certificate after certbot renews it (below) — until
    # that one expires and HTTPS breaks. Reload every 6h to pick up renewals.
    command: "/bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g \"daemon off;\"'"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Custom nginx configs
      - ./nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx-proxy/conf.d:/etc/nginx/conf.d:ro
      # Let's Encrypt certificates (managed by certbot)
      - certbot_conf:/etc/letsencrypt:ro
      # ACME challenge webroot (shared with certbot)
      - certbot_www:/var/www/certbot:ro
    depends_on:
      - app
      - server
      - wordpress
    networks:
      - nixsoft_network

  # ─── Certbot (Automatic SSL Renewal) ─────────────────────────────────────────
  certbot:
    image: certbot/certbot:v2.11.0
    restart: unless-stopped
    volumes:
      # Same volumes as nginx-proxy so it can write certs nginx reads
      - certbot_conf:/etc/letsencrypt
      - certbot_www:/var/www/certbot
    # Check for renewal every 12 hours; Let's Encrypt certs are valid 90 days
    # and renewed automatically when < 30 days remain
    # `--webroot` here applies to every certificate, including nixsoftech.in,
    # which was first issued via DigitalOcean DNS (certbot-dns below): once
    # DNS points at this server, renewals use the HTTP challenge like UAT's.
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h & wait $${!}; done;'"
    networks:
      - nixsoft_network

  # ─── One-off tools — never started by `docker compose up` ────────────────────
  # Run with `docker compose run --rm <service> ...` (see CUTOVER.md).

  # Issues the production certificate BEFORE the DNS switch, by proving
  # domain ownership through a DigitalOcean DNS record instead of over HTTP.
  # Needs ./digitalocean.ini (gitignored): dns_digitalocean_token = <token>
  certbot-dns:
    image: certbot/dns-digitalocean:v2.11.0
    profiles: ["tools"]
    volumes:
      - certbot_conf:/etc/letsencrypt
      - ./digitalocean.ini:/digitalocean.ini:ro

  # WP-CLI against the live WordPress files and database, e.g. the
  # blog.new.nixsoftech.in -> blog.nixsoftech.in search-replace at cutover.
  wpcli:
    image: wordpress:cli-2.11.0-php8.3
    profiles: ["tools"]
    # uid 33 = www-data in the Debian-based wordpress image, so files WP-CLI
    # writes (e.g. regenerated thumbnails) stay owned by the web server.
    user: "33:33"
    depends_on:
      - db
    environment:
      WORDPRESS_DB_HOST: db
      WORDPRESS_DB_USER: wp_user
      WORDPRESS_DB_PASSWORD: ${MYSQL_PASSWORD:?Set MYSQL_PASSWORD in .env}
      WORDPRESS_DB_NAME: wordpress
    volumes:
      - wordpress_data:/var/www/html
    networks:
      - nixsoft_network

networks:
  nixsoft_network:
    driver: bridge

volumes:
  db_data:
  wordpress_data:
  chat_logs:
  certbot_conf:    # Let's Encrypt certs & config
  certbot_www:     # ACME challenge files
