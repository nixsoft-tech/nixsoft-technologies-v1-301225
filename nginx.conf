server {
    listen 80;
    server_name localhost;

    # Core Pages Redirects (Strip trailing slashes if present)
    rewrite ^/about-us/?$ /about permanent;
    rewrite ^/contact-us/?$ /contact permanent;
    rewrite ^/services/?$ /solutions permanent;
    rewrite ^/nixsoft-blog/?$ /blog permanent;

    # Service Redirections to Solutions Page Sections
    rewrite ^/service/devops-automation/?$ /solutions#devops permanent;
    rewrite ^/service/it-managed-services/?$ /solutions#devops permanent;
    rewrite ^/service/infrastructure-monitoring/?$ /solutions#ai-ops permanent;
    rewrite ^/service/synthetic-monitoring/?$ /solutions#ai-ops permanent;
    rewrite ^/service/application-performance-monitoring/?$ /solutions#ai-ops permanent;
    rewrite ^/service/database-management-service/?$ /solutions#database permanent;
    rewrite ^/service/cloud-managed-service/?$ /solutions#cloud permanent;
    rewrite ^/service/security-testing/?$ /solutions#security permanent;
    rewrite ^/service/.*$ /solutions permanent;

    # Legacy Product and Solutions Redirects
    rewrite ^/asset-management/?$ /products permanent;
    rewrite ^/email-collaboration/?$ /products permanent;
    rewrite ^/ticketing-system/?$ /products permanent;
    rewrite ^/get-quote/?$ /contact permanent;
    rewrite ^/raise-ticket/?$ /contact permanent;
    rewrite ^/testing/?$ /solutions permanent;
    rewrite ^/monitoring/?$ /solutions permanent;
    rewrite ^/it-service-management/?$ /solutions permanent;

    # Blog Post Redirection (Any single segment path not matching static assets/pages/files)
    #
    # NOTE: this must check $uri, not $request_uri. try_files' final fallback
    # (/index.html, below) performs an *internal redirect* whenever no static
    # file matches — e.g. for a bare "/" request — and that internal redirect
    # re-enters this block with $uri now equal to "/index.html". $request_uri
    # is defined to stay fixed at the client's original request ("/") across
    # internal redirects, so checking it here would never catch that case,
    # and "/" would wrongly fall through to the catch-all rewrite below and
    # get redirected to /blog/index.html instead of serving the homepage.
    if ($uri !~ ^/(assets|about|contact|solutions|products|blog|admin|index\.html|sitemap\.xml|robots\.txt|logo\.png|favicon\.ico|wp-json)) {
        rewrite ^/([^/]+)/?$ /blog/$1 permanent;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
