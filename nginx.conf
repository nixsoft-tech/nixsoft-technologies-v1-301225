server {
    listen 80;
    server_name localhost;

    # Send relative Location headers. This container listens on plain :80 behind
    # the TLS proxy, so absolute redirects would point at http:// and add an
    # extra http->https hop to every 301.
    absolute_redirect off;

    # Core Pages Redirects (Strip trailing slashes if present)
    rewrite ^/about-us/?$ /about permanent;
    rewrite ^/contact-us/?$ /contact permanent;
    rewrite ^/nixsoft-blog/?$ /blog permanent;

    # Old-site service pages (/service/<slug>) -> Services tab (/services/<slug>).
    # Renamed slugs first; every other old slug carries over unchanged.
    # Keep in sync with legacyAliases in data/services.ts.
    rewrite ^/service/devops-automation/?$ /services/devops-services permanent;
    rewrite ^/service/cloud-managed-service/?$ /services/cloud-management-services permanent;
    rewrite ^/service/database-management-service/?$ /services/db-management-services permanent;
    rewrite ^/service/application-performance-monitoring/?$ /services/application-monitoring permanent;
    rewrite ^/service/([^/]+)/?$ /services/$1 permanent;
    rewrite ^/service/?$ /services permanent;

    # Old-site solution pages -> Solutions tab
    rewrite ^/asset-management/?$ /solutions/asset-management permanent;
    rewrite ^/email-collaboration/?$ /solutions/email-collaboration permanent;
    rewrite ^/ticketing-system/?$ /solutions/ticketing-system permanent;

    # WordPress admin lives on the blog subdomain (headless WP origin), not on
    # the React site. Must come before the blog catch-all below, which would
    # otherwise turn /wp-admin into /blog/wp-admin. "blog.$host" maps
    # new.nixsoftech.in -> blog.new.nixsoftech.in (and the apex -> blog.nixsoftech.in).
    # 302, not 301: browsers cache 301s, and this target may change per environment.
    rewrite ^/(wp-admin(?:/.*)?|wp-login\.php)$ https://blog.$host/$1 redirect;

    # Old-site images (indexed in Google Images, linked from other sites).
    # The WordPress import kept their /wp-content/uploads/ paths on the blog
    # host, so one 301 covers them all. Same blog.$host mapping as above.
    rewrite ^/wp-content/uploads/(.*)$ https://blog.$host/wp-content/uploads/$1 permanent;

    # Old Yoast sitemaps (sitemap_index.xml, post-sitemap.xml, ...) are what
    # Search Console has on file; point them at the new sitemap.
    rewrite ^/(sitemap_index|[a-z_]+-sitemap[0-9]*)\.xml$ /sitemap.xml permanent;

    # Old-site category and utility pages
    rewrite ^/(testing|monitoring|it-service-management)/?$ /services permanent;
    rewrite ^/get-quote/?$ /contact permanent;
    rewrite ^/raise-ticket/?$ /contact permanent;

    # Old-site team profiles -> the Team section of About. Must precede the
    # blog catch-all, which would otherwise send /team/ to /blog/team.
    # The target is quoted because an unquoted "#" starts an nginx comment.
    rewrite ^/team(/.*)?$ "/about#team" permanent;

    # Old-site service categories (/category-service/<slug>). Categories with a
    # matching service page go there; the broad ones go to the Services tab.
    rewrite ^/category-service/cloud-management/?$ /services/cloud-management-services permanent;
    rewrite ^/category-service/middleware-services/?$ /services/middleware-services permanent;
    rewrite ^/category-service/db-management-services/?$ /services/db-management-services permanent;
    rewrite ^/category-service/rpa/?$ /services/robotics-process-automation permanent;
    rewrite ^/category-service(/.*)?$ /services permanent;

    # WordPress archive, tag, author and feed URLs -> Blog. The new blog has no
    # tag/category/author pages, and the RSS feed lives on the WordPress host.
    rewrite ^/(category|tag|author)(/.*)?$ /blog permanent;
    rewrite ^/(comments/)?feed/?$ /blog permanent;

    # Other old-site URLs that Google Analytics shows real visits to (Oct 2026
    # review of both GA4 properties): pagination and date archives, a
    # duplicate About page, and guessed contact/team/service URLs.
    # Quoted where the regex has { } or the target has "#" (nginx syntax).
    rewrite ^/about-us-2/?$ /about permanent;
    rewrite ^/(our-team|leadership)/?$ "/about#team" permanent;
    rewrite ^/(contacts|contactus|contact-us\.html|contact\.html|get-in-touch|getintouch|enquiry|inquiry|reach-us|reachus|connect|support|help|careers?)/?$ /contact permanent;
    rewrite ^/application-monitoring/?$ /services/application-monitoring permanent;
    rewrite ^/cloud-services/?$ /services/cloud-management-services permanent;
    rewrite ^/(it-services|service/page/[0-9]+)/?$ /services permanent;
    rewrite ^/(blogs|category-blog|Blog(/.*)?)/?$ /blog permanent;
    rewrite ^/(nixsoft-blog/)?page/[0-9]+/?$ /blog permanent;
    rewrite "^/[0-9]{4}/[0-9]{2}(/.*)?$" /blog permanent;

    # Blog Post Redirection (Any single segment path not matching static assets/pages/files)
    #
    # NOTE: this must check $uri, not $request_uri. try_files' final fallback
    # (/index.html, below) performs an *internal redirect* whenever no static
    # file matches — e.g. for a bare "/" request — and that internal redirect
    # re-enters this block with $uri now equal to "/index.html". $request_uri
    # is defined to stay fixed at the client's original request ("/") across
    # internal redirects, so checking it here would never catch that case,
    # and "/" would wrongly fall through to the catch-all rewrite below and
    # get redirected to /blog/index.html instead of serving the homepage.
    # Match blog slugs ONLY — the [^/.] class excludes any path containing a
    # dot, so root static files (logo.svg, favicon.png, og-image.png, *.js …)
    # are never mistaken for legacy blog slugs and 301'd to /blog/<file>.
    # Every top-level app route in App.tsx must be listed here, or loading it
    # directly (search result, shared link, refresh) bounces to /blog/<route>.
    if ($uri !~ ^/(assets|about|contact|services|solutions|products|industries|clients|blog|privacy-policy|admin|index\.html|sitemap\.xml|robots\.txt|logo\.svg|favicon\.png|apple-touch-icon\.png|og-image\.png|wp-json)) {
        rewrite ^/([^/.]+)/?$ /blog/$1 permanent;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        # No "$uri/": asset folders like /clients/ (client logos) share a name
        # with app routes, and a directory match would serve a 403 instead of
        # the app. Anything that isn't a real file falls through to the SPA.
        try_files $uri /index.html;
    }

    # Cache static assets
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
