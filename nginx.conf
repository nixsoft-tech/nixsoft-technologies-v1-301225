# Old WordPress tag pages (/tag/<tag>/) -> the article that tag belonged to.
# Built on 6 Nov 2026 from blog.nixsoftech.in's tags: 42 of the 43 old tags
# label exactly one post. it-managed-services labels four posts about managed
# IT, so it goes to that service page. Unknown tags fall through to the
# generic /tag/* -> /blog rule in the server block.
map $uri $old_tag_target {
    default "";
    ~^/tag/ai-technology-in-industries(/.*)?$ /blog/how-ai-and-machine-learning-are-transforming-industries;
    ~^/tag/application-management-risks(/.*)?$ /blog/the-dark-side-of-application-management-secrets-your-it-department-doesnt-want-you-to-know;
    ~^/tag/automation-in-it-infrastructure(/.*)?$ /blog/the-essential-role-of-it-automation-in-modern-business-operations;
    ~^/tag/aws-cloud-management-tips(/.*)?$ /blog/top-aws-cloud-management-best-practices-for-2024;
    ~^/tag/aws-security-best-practices(/.*)?$ /blog/top-aws-cloud-management-best-practices-for-2024;
    ~^/tag/cloud-computing(/.*)?$ /blog/why-cloud-computing-services-are-essential-for-indian-startups;
    ~^/tag/cloud-services(/.*)?$ /blog/why-cloud-computing-services-are-essential-for-indian-startups;
    ~^/tag/cloud-technology(/.*)?$ /blog/why-cloud-computing-services-are-essential-for-indian-startups;
    ~^/tag/cost-effective-it-strategies(/.*)?$ /blog/the-dark-side-of-application-management-secrets-your-it-department-doesnt-want-you-to-know;
    ~^/tag/cyber-risk-management(/.*)?$ /blog/top-5-essential-cybersecurity-services-every-business-needs;
    ~^/tag/cybersecurity-services-for-smbs(/.*)?$ /blog/top-5-essential-cybersecurity-services-every-business-needs;
    ~^/tag/data-protection-in-postgresql(/.*)?$ /blog/securing-postgresql-essential-tips-to-protect-your-database;
    ~^/tag/database-solutions-for-large-scale-apps(/.*)?$ /blog/scaling-postgresql-for-high-traffic-applications-tips-and-best-practices;
    ~^/tag/devops(/.*)?$ /blog/understanding-devops-a-comprehensive-guide-for-beginners;
    ~^/tag/devops-best-practices(/.*)?$ /blog/understanding-devops-a-comprehensive-guide-for-beginners;
    ~^/tag/devops-for-beginners(/.*)?$ /blog/understanding-devops-a-comprehensive-guide-for-beginners;
    ~^/tag/devops-guide(/.*)?$ /blog/understanding-devops-a-comprehensive-guide-for-beginners;
    ~^/tag/devops-tools(/.*)?$ /blog/understanding-devops-a-comprehensive-guide-for-beginners;
    ~^/tag/fintech-industry(/.*)?$ /blog/the-rise-of-open-source-solutions-in-financial-tech-opportunities-and-challenges;
    ~^/tag/future-of-ai-in-business(/.*)?$ /blog/how-ai-and-machine-learning-are-transforming-industries;
    ~^/tag/indian-startups(/.*)?$ /blog/why-cloud-computing-services-are-essential-for-indian-startups;
    ~^/tag/it-automation-solutions-for-businesses(/.*)?$ /blog/the-essential-role-of-it-automation-in-modern-business-operations;
    ~^/tag/it-operations-management-tools(/.*)?$ /blog/streamlining-operations-with-it-service-management-using-open-source-tools;
    ~^/tag/it-operations-monitoring-software(/.*)?$ /blog/open-source-tools-for-it-operations-monitoring-a-comprehensive-review;
    ~^/tag/it-process-automation-benefits(/.*)?$ /blog/the-essential-role-of-it-automation-in-modern-business-operations;
    ~^/tag/it-solution-providers(/.*)?$ /blog/top-10-it-managed-services-support-and-solution-providers-in-mumbai;
    ~^/tag/machine-learning-trends-2024(/.*)?$ /blog/how-ai-and-machine-learning-are-transforming-industries;
    ~^/tag/monitoring-postgresql-performance(/.*)?$ /blog/securing-postgresql-essential-tips-to-protect-your-database;
    ~^/tag/mysql-performance-best-practices(/.*)?$ /blog/turbocharge-your-mysql-10-essential-tips-for-lightning-fast-performance;
    ~^/tag/open-source-benefits(/.*)?$ /blog/the-rise-of-open-source-solutions-in-financial-tech-opportunities-and-challenges;
    ~^/tag/open-source-it-monitoring-tools(/.*)?$ /blog/open-source-tools-for-it-operations-monitoring-a-comprehensive-review;
    ~^/tag/open-source-itsm-software(/.*)?$ /blog/streamlining-operations-with-it-service-management-using-open-source-tools;
    ~^/tag/open-source-solutions(/.*)?$ /blog/the-rise-of-open-source-solutions-in-financial-tech-opportunities-and-challenges;
    ~^/tag/open-source-solutions-for-it-monitoring(/.*)?$ /blog/open-source-tools-for-it-operations-monitoring-a-comprehensive-review;
    ~^/tag/optimizing-mysql-databases(/.*)?$ /blog/turbocharge-your-mysql-10-essential-tips-for-lightning-fast-performance;
    ~^/tag/postgresql-performance-tuning-tips(/.*)?$ /blog/scaling-postgresql-for-high-traffic-applications-tips-and-best-practices;
    ~^/tag/postgresql-security-tips(/.*)?$ /blog/securing-postgresql-essential-tips-to-protect-your-database;
    ~^/tag/qa-automation-benefits(/.*)?$ /blog/how-automation-testing-enhances-software-quality-and-efficiency;
    ~^/tag/query-tuning-techniques-for-mysql(/.*)?$ /blog/turbocharge-your-mysql-10-essential-tips-for-lightning-fast-performance;
    ~^/tag/security-risks-in-application-management(/.*)?$ /blog/the-dark-side-of-application-management-secrets-your-it-department-doesnt-want-you-to-know;
    ~^/tag/testing-automation-tools-and-strategies(/.*)?$ /blog/how-automation-testing-enhances-software-quality-and-efficiency;
    ~^/tag/workflow-automation-for-it-services(/.*)?$ /blog/streamlining-operations-with-it-service-management-using-open-source-tools;
    ~^/tag/it-managed-services(/.*)?$ /services/it-managed-services;
}

server {
    listen 80;
    server_name localhost;

    # Send relative Location headers. This container listens on plain :80 behind
    # the TLS proxy, so absolute redirects would point at http:// and add an
    # extra http->https hop to every 301.
    absolute_redirect off;

    # Core Pages Redirects (Strip trailing slashes if present)
    rewrite ^/about-us/?$ /about permanent;
    rewrite ^/contact-us/?$ /contact permanent;
    rewrite ^/nixsoft-blog/?$ /blog permanent;

    # Old-site service pages (/service/<slug>) -> Services tab (/services/<slug>).
    # Renamed slugs first; every other old slug carries over unchanged.
    # Keep in sync with legacyAliases in data/services.ts.
    rewrite ^/service/devops-automation/?$ /services/devops-services permanent;
    rewrite ^/service/cloud-managed-service/?$ /services/cloud-management-services permanent;
    rewrite ^/service/database-management-service/?$ /services/db-management-services permanent;
    rewrite ^/service/application-performance-monitoring/?$ /services/application-monitoring permanent;
    rewrite ^/service/([^/]+)/?$ /services/$1 permanent;
    rewrite ^/service/?$ /services permanent;

    # Old-site solution pages -> Solutions tab
    rewrite ^/asset-management/?$ /solutions/asset-management permanent;
    rewrite ^/email-collaboration/?$ /solutions/email-collaboration permanent;
    rewrite ^/ticketing-system/?$ /solutions/ticketing-system permanent;

    # WordPress admin lives on the blog subdomain (headless WP origin), not on
    # the React site. Must come before the blog catch-all below, which would
    # otherwise turn /wp-admin into /blog/wp-admin. "blog.$host" maps
    # new.nixsoftech.in -> blog.new.nixsoftech.in (and the apex -> blog.nixsoftech.in).
    # 302, not 301: browsers cache 301s, and this target may change per environment.
    rewrite ^/(wp-admin(?:/.*)?|wp-login\.php)$ https://blog.$host/$1 redirect;

    # Old-site images (indexed in Google Images, linked from other sites).
    # The WordPress import kept their /wp-content/uploads/ paths on the blog
    # host, so one 301 covers them all. Same blog.$host mapping as above.
    rewrite ^/wp-content/uploads/(.*)$ https://blog.$host/wp-content/uploads/$1 permanent;

    # Old Yoast sitemaps (sitemap_index.xml, post-sitemap.xml, ...) are what
    # Search Console has on file; point them at the new sitemap.
    rewrite ^/(sitemap_index|[a-z_]+-sitemap[0-9]*)\.xml$ /sitemap.xml permanent;

    # Old-site category and utility pages
    rewrite ^/testing/?$ /services permanent;
    # The old IT service management URL (also crawled as /blog/...).
    rewrite ^/(blog/)?it-service-management/?$ /services/it-managed-services permanent;
    rewrite ^/monitoring/?$ /services/infrastructure-monitoring permanent;
    rewrite ^/get-quote/?$ /contact permanent;
    rewrite ^/raise-ticket/?$ /contact permanent;

    # Directors' profile pages (/team/<id>, data/team.ts) are served as-is;
    # "/team/pravin-kore/" falls through to the trailing-slash rule below.
    # Any other /team URL from the old site -> the Team section of About.
    # Must precede the blog catch-all, which would otherwise send /team/ to
    # /blog/team. Quoted: an unquoted "#" starts an nginx comment.
    rewrite "^/team(?!/(pravin-kore|wajid-shaikh)/?$)(/.*)?$" "/about#team" permanent;

    # Old-site service categories (/category-service/<slug>). Categories with a
    # matching service page go there; the broad ones go to the Services tab.
    rewrite ^/category-service/cloud-management/?$ /services/cloud-management-services permanent;
    rewrite ^/category-service/middleware-services/?$ /services/middleware-services permanent;
    rewrite ^/category-service/db-management-services/?$ /services/db-management-services permanent;
    rewrite ^/category-service/rpa/?$ /services/robotics-process-automation permanent;
    rewrite ^/category-service(/.*)?$ /services permanent;

    # Old tag pages go to the article they labelled ($old_tag_target, mapped at
    # the top of this file). Every other WordPress archive, tag, author and feed
    # URL -> Blog. The new blog has no tag/category/author pages, and the RSS
    # feed lives on the WordPress host.
    if ($old_tag_target) {
        return 301 $old_tag_target;
    }
    rewrite ^/(category|tag|author)(/.*)?$ /blog permanent;
    # The old WordPress feed (/feed/) -> the blog's RSS feed, so existing
    # subscribers keep receiving posts. Comment feeds have no equivalent.
    rewrite ^/feed/?$ /feed.xml permanent;
    # A post's feed URL (WordPress style) -> the post itself.
    rewrite ^/blog/([^/]+)/feed/?$ /blog/$1 permanent;
    rewrite ^/comments/feed/?$ /blog permanent;

    # Other old-site URLs that Google Analytics shows real visits to (Oct 2026
    # review of both GA4 properties): pagination and date archives, a
    # duplicate About page, and guessed contact/team/service URLs.
    # Quoted where the regex has { } or the target has "#" (nginx syntax).
    rewrite ^/about-us-2/?$ /about permanent;
    rewrite ^/(our-team|leadership)/?$ "/about#team" permanent;
    rewrite ^/(contacts|contactus|contact-us\.html|contact\.html|get-in-touch|getintouch|enquiry|inquiry|reach-us|reachus|connect|support|help|careers?)/?$ /contact permanent;
    rewrite ^/application-monitoring/?$ /services/application-monitoring permanent;
    rewrite ^/cloud-services/?$ /services/cloud-management-services permanent;
    rewrite ^/(it-services|service/page/[0-9]+)/?$ /services permanent;
    rewrite ^/(blogs|category-blog|Blog(/.*)?)/?$ /blog permanent;
    rewrite ^/(nixsoft-blog/)?page/[0-9]+/?$ /blog permanent;
    rewrite "^/[0-9]{4}/[0-9]{2}(/.*)?$" /blog permanent;

    # The old site's 17 articles lived at /<slug>/; they're now /blog/<slug>.
    # Their WordPress comment feeds (/<slug>/feed/) go to the article too.
    # Only these slugs are redirected. Any other unknown path gets a real 404
    # (below) instead of a redirect into a blog page that doesn't exist.
    # Keep in sync with the posts on blog.nixsoftech.in if old URLs change.
    rewrite "^/(the-essential-role-of-it-automation-in-modern-business-operations|scaling-postgresql-for-high-traffic-applications-tips-and-best-practices|securing-postgresql-essential-tips-to-protect-your-database|turbocharge-your-mysql-10-essential-tips-for-lightning-fast-performance|the-dark-side-of-application-management-secrets-your-it-department-doesnt-want-you-to-know|top-10-benefits-of-it-managed-services-for-indian-businesses|the-future-of-it-managed-services-trends-and-innovations-in-2024|understanding-devops-a-comprehensive-guide-for-beginners|why-cloud-computing-services-are-essential-for-indian-startups|top-10-it-managed-services-support-and-solution-providers-in-mumbai|the-rise-of-open-source-solutions-in-financial-tech-opportunities-and-challenges|how-ai-and-machine-learning-are-transforming-industries|top-aws-cloud-management-best-practices-for-2024|top-5-essential-cybersecurity-services-every-business-needs|how-automation-testing-enhances-software-quality-and-efficiency|open-source-tools-for-it-operations-monitoring-a-comprehensive-review|streamlining-operations-with-it-service-management-using-open-source-tools)(/feed)?/?$" /blog/$1 permanent;

    # Duplicate URL variants -> the canonical URL in one 301: a trailing slash
    # ("/about/" -> "/about") and "/index.html" -> "/". These come after the
    # legacy rules above so an old URL still takes a single hop. $request_uri
    # is the client's original URL, so the internal redirects to /index.html
    # (error_page, @app) are not caught by the index.html rule.
    if ($request_uri ~ "^/index\.html(\?|$)") {
        return 301 /$is_args$args;
    }
    rewrite ^/(.+)/$ /$1 permanent;

    root /usr/share/nginx/html;

    # Unknown URLs: HTTP 404 status, with the app shell as the body so visitors
    # see the Not Found page (search engines get a real 404, not a "soft 404").
    error_page 404 /app.html;

    location / {
        index index.html;
        # No "$uri/": asset folders like /clients/ (client logos) share a name
        # with app routes, and a directory match would serve a 403 instead of
        # the app. Real files are served as-is; everything else goes to @app.
        # $uri/index.html: the page prerendered at build time (scripts/prerender.mjs),
        # e.g. /about -> /about/index.html, / -> /index.html.
        try_files $uri $uri/index.html @app;
    }

    # Blog RSS feed (generated at build). nginx would label .xml as text/xml.
    location = /feed.xml {
        types { }
        default_type application/rss+xml;
    }

    # The plain app shell (no prerendered content). Only served internally.
    location = /app.html {
        internal;
    }

    # Paths that aren't files: the SPA for routes it has (top-level sections
    # in App.tsx — keep this list in sync), a 404 for anything else. Unknown
    # slugs inside a section (e.g. /services/nope) can't be checked here; the
    # app renders its Not Found page for those (noindex).
    location @app {
        if ($uri !~ "^/((about|team|contact|services|solutions|products|industries|clients|blog|privacy-policy|terms-and-conditions|admin)(/.*)?)?$") {
            return 404;
        }
        rewrite ^ /app.html break;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, no-transform";
    }

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
    }
}
