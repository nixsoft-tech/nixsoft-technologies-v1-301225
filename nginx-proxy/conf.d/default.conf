# ─────────────────────────────────────────────────────────────────────────────
# PRODUCTION — nixsoftech.in (see CUTOVER.md for how this goes live)
#
#   nixsoftech.in          → app (React) + /api (Node.js)
#   www.nixsoftech.in      → 301 to nixsoftech.in
#   blog.nixsoftech.in     → WordPress (headless CMS + media)
#   new.nixsoftech.in      → 301 to nixsoftech.in        (retired UAT host)
#   blog.new.nixsoftech.in → 301 to blog.nixsoftech.in   (retired UAT host)
#
# Certificates (both in the certbot_conf volume, renewed by the certbot service):
#   live/nixsoftech.in/      nixsoftech.in, www, blog — issued before the DNS
#                            switch by scripts/issue-production-certs.sh
#   live/new.nixsoftech.in/  the old UAT certificate, kept for the redirects
#
# Unlike the UAT version of this file, the ssl_* lines are active here: both
# certificates exist before this file is deployed, so there is nothing for
# init-letsencrypt.sh to uncomment.
# ─────────────────────────────────────────────────────────────────────────────

# Backends are looked up through Docker's DNS at request time, not once at
# start-up. A deploy recreates the app/server containers and Docker may give
# them new IP addresses; with fixed upstream blocks this proxy kept sending
# traffic to the old addresses and the whole site returned 502 until it was
# reloaded (13 Nov 2026). With a variable in proxy_pass, nginx re-resolves the
# name through the resolver below (127.0.0.11 is Docker's embedded DNS) and
# caches it for 10 s. Without a URI part, proxy_pass $var passes the request
# URI unchanged, exactly as before.
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# The blog host is a headless CMS: its own HTML pages would compete in search
# with the real articles on nixsoftech.in/blog/..., so they're noindexed. Media
# stays indexable (Google Images). An empty value makes add_header send nothing.
map $uri $blog_robots_tag {
    ~^/wp-content/uploads/  "";
    default                 "noindex, follow";
}

# Browser caching for media (articles' images). WordPress serves uploads with
# no caching headers, so every visit re-downloaded them. Uploaded files keep
# their URL for life (a changed image gets a new file name), so 30 days is
# safe. "expires" is used instead of add_header so the server-level headers
# (HSTS, X-Robots-Tag, ...) are still sent.
map $uri $blog_expires {
    ~^/wp-content/uploads/  30d;
    default                 off;
}

# Nobody should browse the headless WordPress itself: its theme pages are
# unbranded demo layouts. Public page URLs on blog.nixsoftech.in 301 to the
# real blog on nixsoftech.in; only what the CMS and the site need is served.
# First matching regex wins; an empty value means "serve from WordPress".
map $uri $blog_public_redirect {
    ~^/(wp-admin|wp-json|wp-content|wp-includes)(/|$)        "";
    ~^/(wp-login\.php|wp-cron\.php|robots\.txt|favicon\.ico)$ "";
    ~^/feed/?$                                                "";
    "~^/[0-9]{4}/[0-9]{2}/[0-9]{2}/(?<post>[^/]+)/?$"         https://nixsoftech.in/blog/$post;
    ~^/(?<post>[a-z0-9-]+)/?$                                 https://nixsoftech.in/blog/$post;
    default                                                   https://nixsoftech.in/blog;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP — ACME challenges for every host; everything else straight to the
# final https URL (one hop, not http → https → apex).
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name nixsoftech.in blog.nixsoftech.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 80;
    server_name www.nixsoftech.in new.nixsoftech.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://nixsoftech.in$request_uri; }
}

server {
    listen 80;
    server_name blog.new.nixsoftech.in;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://blog.nixsoftech.in$request_uri; }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — Main site: nixsoftech.in
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name nixsoftech.in;

    ssl_certificate     /etc/letsencrypt/live/nixsoftech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nixsoftech.in/privkey.pem;
    # ssl_protocols, ssl_ciphers, session cache etc. come from this include —
    # do NOT redeclare them here ("directive is duplicate" is a fatal error).
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;
    # No ssl_stapling: Let's Encrypt certificates no longer carry an OCSP URL
    # (since 2025), so nginx ignored it and logged a warning on every reload.

    # ── Security Headers ──────────────────────────────────────────────────────
    # HSTS deliberately WITHOUT includeSubDomains/preload: support.nixsoftech.in
    # (ticketing portal) is HTTP-only, and includeSubDomains on the apex would
    # make browsers refuse it for two years. Add both only once every
    # *.nixsoftech.in subdomain serves HTTPS.
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://www.googletagmanager.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com https://blog.nixsoftech.in https://*.google-analytics.com https://*.googletagmanager.com; frame-src 'self' https://www.google.com; connect-src 'self' https://blog.nixsoftech.in https://*.google-analytics.com https://*.analytics.google.com https://*.googletagmanager.com; object-src 'none'; frame-ancestors 'none';" always;

    # No X-Robots-Tag and no robots.txt override: this is the indexed site.
    # /robots.txt and /sitemap.xml are served from the app (public/).

    # ── /api — Node.js Backend ────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        set $node_api      http://server:5000;
        proxy_pass         $node_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # Rate-limited requests get 429 Too Many Requests (nginx's default, 503,
    # reads as "server down" to browsers, crawlers and monitoring).
    limit_req_status 429;

    # ── / — React Frontend (pages) ────────────────────────────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;

        set $react_app     http://app:80;
        proxy_pass         $react_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";
    }

    # ── Static files: cached, and NOT rate-limited ────────────────────────────
    # Deliberately outside `location /`: nested inside it, they inherited its
    # limit_req, so one page view's JS chunks, images and fonts counted against
    # the 100/min page limit. Fast browsing, and Googlebot rendering pages,
    # then got 503s for JS chunks and a blank page (QA report, 6 Nov 2026).
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot|webp)$ {
        set $react_app     http://app:80;
        proxy_pass         $react_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   Connection        "";
        expires    1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — www.nixsoftech.in → nixsoftech.in (the old Apache server used to do
# this; without it www and apex would both serve the site as duplicates)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name www.nixsoftech.in;

    ssl_certificate     /etc/letsencrypt/live/nixsoftech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nixsoftech.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    return 301 https://nixsoftech.in$request_uri;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — WordPress: blog.nixsoftech.in
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name blog.nixsoftech.in;

    ssl_certificate     /etc/letsencrypt/live/nixsoftech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nixsoftech.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;
    add_header X-Robots-Tag              $blog_robots_tag                      always;
    expires $blog_expires;

    client_max_body_size 64M;  # Allow WordPress media uploads

    # XML-RPC isn't used by a headless site and is a common brute-force
    # target (one request can try hundreds of passwords).
    location = /xmlrpc.php {
        return 403;
    }

    location / {
        # Public theme pages (home, posts, archives, ?author=N) → the real blog
        if ($blog_public_redirect) {
            return 301 $blog_public_redirect;
        }

        set $wordpress_blog http://wordpress:80;
        proxy_pass         $wordpress_blog;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        # wp-admin imports, plugin updates and media processing can run for
        # minutes (PHP max_execution_time is 300s, see wordpress/uploads.ini).
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — retired UAT hosts → production (links shared during UAT keep working)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name new.nixsoftech.in;

    ssl_certificate     /etc/letsencrypt/live/new.nixsoftech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.nixsoftech.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://nixsoftech.in$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name blog.new.nixsoftech.in;

    ssl_certificate     /etc/letsencrypt/live/new.nixsoftech.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/new.nixsoftech.in/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://blog.nixsoftech.in$request_uri;
}
