# ─────────────────────────────────────────────────────────────────────────────
# Upstream services (all internal — no direct internet access)
# ─────────────────────────────────────────────────────────────────────────────
upstream react_app {
    server app:80;
    keepalive 32;
}

upstream node_api {
    server server:5000;
    keepalive 32;
}

upstream wordpress_blog {
    server wordpress:80;
    keepalive 32;
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTP — Serve ACME challenge only; redirect everything else to HTTPS
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 80;
    server_name new.nixsoftech.in blog.new.nixsoftech.in;

    # Certbot ACME challenge webroot
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect all other HTTP → HTTPS (301 permanent)
    location / {
        return 301 https://$host$request_uri;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — Main application: new.nixsoftech.in
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name new.nixsoftech.in;

    # ── SSL Certificates (Commented out for initial run — uncomment after Certbot runs) ──
    # ssl_certificate     /etc/letsencrypt/live/new.nixsoftech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/new.nixsoftech.in/privkey.pem;

    # ── SSL Hardening ─────────────────────────────────────────────────────────
    # ssl_protocols, ssl_ciphers, ssl_prefer_server_ciphers, ssl_session_cache,
    # ssl_session_timeout, and ssl_session_tickets all come from the
    # Certbot-managed options-ssl-nginx.conf below — do NOT redeclare them
    # here, nginx treats a directive set twice in the same context as a fatal
    # config error ("directive is duplicate").
    ssl_stapling               on;
    ssl_stapling_verify        on;
    # include                    /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam                /etc/letsencrypt/ssl-dhparams.pem;

    # ── Security Headers ──────────────────────────────────────────────────────
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options            "SAMEORIGIN"                                  always;
    add_header X-Content-Type-Options     "nosniff"                                     always;
    add_header X-XSS-Protection           "1; mode=block"                               always;
    add_header Referrer-Policy            "strict-origin-when-cross-origin"             always;
    add_header Permissions-Policy         "camera=(), microphone=(), geolocation=()"    always;
    add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: https://images.unsplash.com https://*.unsplash.com https://nixsoftech.in https://blog.new.nixsoftech.in; frame-src 'self' https://www.google.com; connect-src 'self' http://localhost:5000 https://new.nixsoftech.in https://nixsoftech.in https://blog.new.nixsoftech.in; object-src 'none'; frame-ancestors 'none';" always;

    # ── UAT ONLY: keep this host out of the index ─────────────────────────────
    # Scoped to server_name new.nixsoftech.in, so production (nixsoftech.in) is
    # unaffected and needs no revert. The header is what actually does the work:
    # this is a client-rendered SPA, so a <meta name="robots"> tag would only
    # exist after JS runs, and crawlers that skip rendering would miss it. The
    # header is served on the raw HTML response, before any JS. DELETE THIS
    # BLOCK (and the robots.txt override) if this vhost ever serves production.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    # ── /api — Node.js Backend ────────────────────────────────────────────────
    location /api/ {
        limit_req zone=api burst=20 nodelay;

        proxy_pass         http://node_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Connection        "";

        proxy_connect_timeout 10s;
        proxy_send_timeout    30s;
        proxy_read_timeout    30s;
    }

    # ── / — React Frontend ────────────────────────────────────────────────────
    location / {
        limit_req zone=general burst=50 nodelay;

        proxy_pass         http://react_app;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "";

        # Cache static assets served from React
        #
        # NOTE: any add_header here replaces *all* headers inherited from the
        # server block (nginx only inherits add_header when the current level
        # declares none), so the UAT X-Robots-Tag must be repeated — otherwise
        # images on this host stay indexable via Google Images.
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
            proxy_pass http://react_app;
            expires    1y;
            add_header Cache-Control "public, immutable";
            add_header X-Robots-Tag  "noindex, nofollow, noarchive" always;
            access_log off;
        }
    }

    # Certbot challenge (also needed on HTTPS server block)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}

# ─────────────────────────────────────────────────────────────────────────────
# HTTPS — WordPress Blog: blog.new.nixsoftech.in
# (Point DNS A record to the same server IP)
# ─────────────────────────────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name blog.new.nixsoftech.in;

    # ssl_certificate     /etc/letsencrypt/live/new.nixsoftech.in/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/new.nixsoftech.in/privkey.pem;

    # ssl_protocols, ssl_ciphers, ssl_prefer_server_ciphers, ssl_session_cache,
    # and ssl_session_timeout come from options-ssl-nginx.conf below — see the
    # note in the new.nixsoftech.in server block above.
    # include                    /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam                /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
    add_header X-Frame-Options           "SAMEORIGIN"                          always;
    add_header X-Content-Type-Options    "nosniff"                             always;

    # ── UAT ONLY: keep the staging blog out of the index ──────────────────────
    # This vhost is the headless WordPress origin. Even once the React front end
    # renders the posts, the raw WP HTML is publicly reachable here and would
    # otherwise be indexed as duplicate content competing with the real site.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location = /robots.txt {
        default_type text/plain;
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    client_max_body_size 64M;  # Allow WordPress media uploads

    location / {
        proxy_pass         http://wordpress_blog;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Forwarded-Host  $host;
        proxy_set_header   Connection        "";

        # wp-admin imports, plugin updates and media processing can run for
        # minutes (PHP max_execution_time is 300s, see wordpress/uploads.ini).
        # The 60s nginx default turned long imports into 504 Gateway Timeout.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
}
