; PHP overrides for the WordPress container (mounted into
; /usr/local/etc/php/conf.d/ by docker-compose.yml).
; The official image defaults to 2M uploads, too small for WordPress export
; files and media. Keep upload sizes <= client_max_body_size (64M) in
; nginx-proxy/conf.d/default.conf.
upload_max_filesize = 64M
post_max_size = 64M
memory_limit = 256M
; The importer downloads every image from the old site in one request.
max_execution_time = 300
max_input_time = 300
